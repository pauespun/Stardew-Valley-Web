{% extends 'base.html' %}
{% load static %}

{% block estils_de_pantalla %}
<link rel="stylesheet" href="{% static 'css/muntanya.css' %}">
{% endblock %}

{% block content %}
<div class="pantalla-muntanya">
    <div class="hud-superior">
        <div class="hud-esquerra">💰 <span id="diners">500</span>G</div>
        <div class="hud-centre">🌱 Dia 1 - Primavera</div>
        <div class="hud-dreta">⚡ <span id="energia">270</span>/270</div>
    </div>

    <div class="contingut-muntanya">
        <div class="zona-terreny">
            
            <div class="terreny-proporcional" style="height: 65vh;">
                <img src="{% static 'img/mountain.png' %}" alt="La Muntanya" class="imatge-terreny" style="height: 100%; width: auto;">
                
                <button id="btn-pescar-muntanya" class="boto-accio-mapa" style="top: 70%; left: 18%;">Pescar</button>
            </div>
            
            <a href="/mapa" class="boto-tornar">Tornar al Mapa</a>
            
        </div>
    </div>

    <div id="modal-minijoc" class="fons-modal">
        <div class="finestra-modal modal-pesca">
            <h2>Pesca en curs...</h2>
            
            <div class="contenidor-barra">
                <div id="barra-progres-pesca" class="barra-pesca"></div>
            </div>
            
            <button id="btn-mantenir-pescar" class="boto-mantenir">MANTÉN PREMUT</button>
            <button class="boto-tancar mt-20" onclick="tancarMinijoc()">Cancel·lar</button>
        </div>
    </div>

    <div id="modal-resultat-pesca" class="fons-modal">
        <div class="finestra-modal modal-resultat">
            <h2>Captura aconseguida!</h2>
            
            <div class="info-captura">
                <div id="nom-peix-capturat" class="text-peix"></div>
                <div id="qualitat-peix-capturat" class="text-qualitat"></div>
            </div>
            
            <div class="botons-decisio">
                <button class="boto-agafar" onclick="agafarPeix()">Agafar</button>
                <button class="boto-tirar" onclick="tirarPeix()">Tirar</button>
            </div>
        </div>
    </div>
</div>

<form id="csrf-form" style="display: none;">
    {% csrf_token %}
</form>

<script>
    const URL_GENERAR_PEIX = "{% url 'generar_peix' 'Muntanya' %}";
    const URL_AGAFAR_PEIX = "{% url 'agafar_peix' 'Muntanya' %}";
</script>

<script src="{% static 'js/muntanya_pescar.js' %}"></script>
{% endblock %}
